name: Cardputer ADV

# Builds for the standalone Cardputer ADV + Cap LoRa project (branch cardputer-adv).
#  - release:   when a "cardputer-vX.Y.Z" release is published on GitHub, attaches the full-flash images.
#  - simulator: builds the PC simulator, runs every UI scenario, uploads the screenshots.
#  - firmware:  builds the PlatformIO envs listed in the matrix, reports RAM/flash,
#               uploads firmware.bin (OTA/update) and firmware-merged.bin (full flash at 0x0).

on:
  push:
    branches: [cardputer-adv, 'cardputer-adv-*', 'claude/**']
  release:
    types: [published]       # publish a release from the GitHub site with a new cardputer-v* tag
  pull_request:
    branches: [cardputer-adv]
  workflow_dispatch:

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache LovyanGFX build
        uses: actions/cache@v5
        with:
          path: |
            examples/cardputer_ui/sim/build/LovyanGFX
            examples/cardputer_ui/sim/build/lgfx
            examples/cardputer_ui/sim/build/liblgfx.a
          key: sim-lgfx-${{ hashFiles('examples/cardputer_ui/sim/Makefile') }}

      - name: Build and run scenarios
        run: make -C examples/cardputer_ui/sim -j4 run

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-screenshots
          path: examples/cardputer_ui/sim/build/shots/
          if-no-files-found: ignore

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - cardputer_adv_companion_ble
          - cardputer_adv_standalone
          - cardputer_adv_standalone_map
          - cardputer_adv_demo
    steps:
      - uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }} | tee build.log

      - name: Merge flash image
        run: pio run -e ${{ matrix.environment }} -t mergebin

      - name: Memory report
        run: |
          RAM=$(grep -E '^RAM:' build.log | tail -1)
          FLASH=$(grep -E '^Flash:' build.log | tail -1)
          PCT=$(echo "$RAM" | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          {
            echo "### ${{ matrix.environment }}"
            echo '```'
            echo "$RAM"
            echo "$FLASH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RAM"; echo "$FLASH"
          if [ -n "$PCT" ] && awk "BEGIN{exit !($PCT > 70)}"; then
            echo "::warning title=RAM budget::${{ matrix.environment }} uses ${PCT}% static RAM (budget 70%)"
            echo "**Warning: static RAM above the 70% budget.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: M5Launcher compatibility
        if: matrix.environment != 'cardputer_adv_companion_ble'
        run: |
          python3 tools/launcher_check.py .pio/build/${{ matrix.environment }}/firmware-merged.bin --strict | tee launcher.txt
          { echo '```'; cat launcher.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect binaries
        run: |
          mkdir -p out
          cp .pio/build/${{ matrix.environment }}/firmware.bin out/${{ matrix.environment }}.bin
          cp .pio/build/${{ matrix.environment }}/firmware-merged.bin out/${{ matrix.environment }}-merged.bin
          cp build.log out/${{ matrix.environment }}-build.log

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.environment }}
          path: out/

  release:
    needs: [simulator, firmware]
    if: startsWith(github.ref, 'refs/tags/cardputer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: out

      - name: Keep the full-flash images only
        run: |
          mkdir -p release
          for f in out/*-merged.bin; do
            n=$(basename "$f" -merged.bin)
            cp "$f" "release/${n}-${GITHUB_REF_NAME#cardputer-}.bin"
          done
          ls -la release

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          name: "Cardputer ${{ github.ref_name }}"
          prerelease: true
          append_body: true   # keep the notes written on the release page, add the file list below
          files: release/*.bin
          body: |
            Firmwares pour M5Stack Cardputer ADV. Fichiers à flasher **à l'adresse 0x0**
            (ESPConnect : https://thelastoutpostworkshop.github.io/ESPConnect/).

            - `cardputer_adv_demo` : **démo sans module LoRa** (contacts et GPS simulés)
            - `cardputer_adv_standalone` : autonome (Cap LoRa-1262 requis)
            - `cardputer_adv_standalone_map` : autonome + carte hors ligne sur SD
            - `cardputer_adv_companion_ble` : pour l'appli MeshCore du téléphone

            Mode d'emploi : examples/cardputer_ui/FLASH.md
